apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: enterprise-devops-platform
spec:
  project: default
  source:
    repoURL: https://github.com/MuSeongKweon/enterprise-devops-platform.git
    targetRevision: HEAD
    path: k8s
    directory:
      include: "payment_deployment.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
